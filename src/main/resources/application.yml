server:
  port: 8081

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      # CORS global (Angular + Flutter)
      globalcors:
        corsConfigurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:4200"
              - "http://127.0.0.1:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        # user-service auth
        - id: user-service-auth
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**
        
        # user-service users
        - id: user-service-users
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

        # user-service users
        - id: user-service-guides
          uri: lb://user-service
          predicates:
            - Path=/api/guides/**

        # user-service cities
        - id: user-service-cities
          uri: lb://user-service
          predicates:
            - Path=/api/cities/**

        # user-service languages
        - id: user-service-languages
          uri: lb://user-service
          predicates:
            - Path=/api/languages/**

        # user-service skills
        - id: user-service-skills
          uri: lb://user-service
          predicates:
            - Path=/api/skills/**

        # matching-service
        - id: matching-service
          uri: lb://matching-service
          predicates:
            - Path=/api/matching/**

        # messaging-service REST API
        - id: messaging-service
          uri: lb://messaging-service
          predicates:
            - Path=/api/conversations/**

        # messaging-service WebSocket
        - id: messaging-service-ws
          uri: lb:ws://messaging-service
          predicates:
            - Path=/ws/chat/**

        # booking-service - bookings
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**

        # booking-service - reviews
        - id: booking-service-reviews
          uri: lb://booking-service
          predicates:
            - Path=/api/reviews/**

        # social-service - posts
        - id: social-service-posts
          uri: lb://social-service
          predicates:
            - Path=/api/posts/**

        # social-service - follows (users endpoints for social features)
        - id: social-service-follows
          uri: lb://social-service
          predicates:
            - Path=/api/users/{id}/follow,/api/users/{id}/followers,/api/users/{id}/following,/api/users/{id}/profile

        # notification-service - REST API
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

        # notification-service - WebSocket
        - id: notification-service-ws
          uri: lb:ws://notification-service
          predicates:
            - Path=/ws/notifications/**
  security:
    oauth2:
      resourceserver:
        jwt:
          # Utilisez la clé secrète symétrique pour valider le jeton
          secret-key: ${JWT_SECRET:myVerySecretKeyForJWTTokenGeneration123456789}
          # Laissez ces attributs non définis ou nuls
          # Car vous n'utilisez pas de serveur d'autorisation standard OIDC/OAuth2
          # qui expose un JWK Set URI public.
          # issuer-uri: null
          # jwk-set-uri: null

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
# Configuration CORS
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}